spring.application.name=studybuddy-backend

server.port=${PORT:8080}

# 数据库配置
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studybuddy_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 文件上传配置
file.upload-dir=./uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT配置
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-must-be-at-least-256-bits-long}
jwt.expiration=86400000

# GitHub OAuth配置
github.client.id=${GITHUB_CLIENT_ID:your-github-client-id}
github.client.secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
github.redirect.uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
frontend.url=${FRONTEND_URL:http://localhost:5173}
