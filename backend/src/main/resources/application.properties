spring.application.name=studybuddy-backend

server.port=${PORT:8080}

# 404异常抛出
spring.mvc.throw-exception-if-no-handler-found=true

# 数据库配置
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studybuddy_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 连接池配置（增强容错性）
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# 文件上传配置
file.upload-dir=./uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT配置
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-must-be-at-least-256-bits-long}
jwt.expiration=86400000

# GitHub OAuth配置
github.client.id=${GITHUB_CLIENT_ID:your-github-client-id}
github.client.secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
github.redirect.uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# AI配置（硅基流动 DeepSeek）
ai.api.key=${AI_API_KEY:your-siliconflow-api-key}
ai.api.url=${AI_API_URL:https://api.siliconflow.cn/v1/chat/completions}
ai.model=${AI_MODEL:deepseek-ai/DeepSeek-V4-Pro}
